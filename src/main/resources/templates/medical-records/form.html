<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Medical Record Form | Dhrushaj Hospital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">🏥</div><h2>Dhrushaj Hospital</h2><p>Management System</p></div>
    <nav class="sidebar-nav">
        <div class="nav-section">Main</div>
        <a th:href="@{/dashboard}" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <div class="nav-section">Patients &amp; Doctors</div>
        <a th:href="@{/patients}" class="nav-item"><span class="icon">🧑‍⚕️</span> Patients</a>
        <a th:href="@{/doctors}" class="nav-item"><span class="icon">👨‍⚕️</span> Doctors</a>
        <a th:href="@{/appointments}" class="nav-item"><span class="icon">📅</span> Appointments</a>
        <div class="nav-section">Operations</div>
        <a th:href="@{/bills}" class="nav-item"><span class="icon">💰</span> Billing</a>
        <a th:href="@{/medicines}" class="nav-item"><span class="icon">💊</span> Medicines</a>
        <a th:href="@{/staff}" class="nav-item"><span class="icon">👥</span> Staff</a>
        <a th:href="@{/medical-records}" class="nav-item active"><span class="icon">📋</span> Medical Records</a>

        <div class="nav-section">Admin</div>
        <a th:href="@{/admin/dashboard}" class="nav-item"><span class="icon">🛡️</span> Admin Panel</a>
        <a th:href="@{/admin/reports}" class="nav-item"><span class="icon">📈</span> Reports</a>
    </nav>
    <div class="sidebar-footer"><a th:href="@{/logout}"><span>🚪</span> Logout</a></div>
</div>
<div class="main">
    <div class="topbar"><h1>New Medical Record</h1><div class="topbar-right"><span>🏥 Dhrushaj Hospital</span></div></div>
    <div class="content">
        <div class="page-header">
            <h2>Add Medical Record</h2>
            <a th:href="@{/medical-records}" class="btn btn-secondary">← Back</a>
        </div>
        <div class="panel">
            <div class="panel-body">
                <form th:action="@{/medical-records/save}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Patient</label>
                            <select name="patientId" required>
                                <option value="">-- Select Patient --</option>
                                <option th:each="p : ${patients}" 
                                        th:value="${p.id}" 
                                        th:text="${p.name}"
                                        th:selected="${selectedPatientId != null && selectedPatientId == p.id}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Doctor (Optional)</label>
                            <select name="doctorId">
                                <option value="">-- Select Doctor --</option>
                                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name + ' (' + d.specialization + ')'}"></option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label>Diagnosis</label>
                            <textarea name="diagnosis" rows="3" placeholder="Enter diagnosis..." required></textarea>
                        </div>
                        <div class="form-group full">
                            <label>Prescription</label>
                            <textarea name="prescription" rows="3" placeholder="Enter prescription..."></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">💾 Save Record</button>
                        <a th:href="@{/medical-records}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
